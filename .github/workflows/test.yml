name: Test Evolve

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q main.py launcher.py performance_tuning.py ecosystem_expansion.py cognitive_upgrade.py visual_upgrade.py evolve_engine.py evolve_core.py evolve_core_v2.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Expanded startup contract
        run: >-
          python -c "import performance_tuning; performance_tuning.install(); import ecosystem_expansion; ecosystem_expansion.install(); from evolve_engine import World; w=World(seed=123); assert len(w.population)==2; assert [r.sex for r in w.population]==['male','female']; assert len(w.predators)>=4; assert len(w.shelters)>=10; print('expanded startup OK')"
      - name: Launcher import contract
        run: >-
          python -c "import launcher; import main; from evolve_engine import World; w=World(seed=7); b=w.population[0].brain; assert hasattr(b, 'skills'); assert hasattr(b, 'current_goal'); assert main.EvolveApp.draw.__module__ == 'visual_upgrade'; print('launcher cognitive + visual hooks OK')"
      - name: Headless performance smoke
        run: >-
          python -c "import time; import performance_tuning; performance_tuning.install(); import ecosystem_expansion; ecosystem_expansion.install(); from evolve_engine import World; w=World(seed=42); t=time.perf_counter(); w.step(120); elapsed=time.perf_counter()-t; print(f'120 ticks: {elapsed:.4f}s'); assert elapsed < 20.0"
