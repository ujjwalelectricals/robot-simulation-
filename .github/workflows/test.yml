name: Test Evolve

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q main.py evolve_engine.py evolve_core.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Headless smoke test
        run: python main.py --headless --generations 4 --population 12 --seed 123
      - name: Large population benchmark
        run: python main.py --headless --generations 2 --population 180 --seed 321
