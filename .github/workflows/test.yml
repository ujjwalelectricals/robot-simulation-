name: Test Evolve

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q main.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Headless smoke test
        run: python main.py --headless --generations 3 --population 8 --seed 123
