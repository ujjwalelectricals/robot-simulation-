name: Test Evolve

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q main.py performance_tuning.py evolve_engine.py evolve_core.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Focused startup contract
        run: >-
          python -c "from evolve_engine import World; w=World(seed=123); assert len(w.population)==2; assert [r.sex for r in w.population]==['male','female']; w.configure(population=24); w.reset(); assert len(w.population)==2; print('startup founders OK')"
