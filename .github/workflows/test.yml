name: Test Evolve

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q main.py main_3d.py launcher.py performance_tuning.py ecosystem_expansion.py cognitive_upgrade.py hierarchical_behavior.py survival_memory_upgrade.py memory_enhancement.py advanced_evolution.py evolve_engine.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Startup contract
        run: >-
          python -c "import launcher, main_3d; from evolve_engine import World; w=World(seed=123); assert len(w.population)==2; assert [r.sex for r in w.population]==['male','female']; assert len(w.predators)>=4; assert len(w.shelters)>=10; assert main_3d.Evolve3DApp.__module__ == 'main_3d'; print('3D startup OK')"
      - name: Headless performance smoke
        run: >-
          python -c "import time; import performance_tuning; performance_tuning.install(); import ecosystem_expansion; ecosystem_expansion.install(); from evolve_engine import World; w=World(seed=42); t=time.perf_counter(); w.step(120); elapsed=time.perf_counter()-t; print(f'120 ticks: {elapsed:.4f}s'); assert elapsed < 20.0"
